plugins {
    id 'net.neoforged.moddev' version '2.0.78'
    id 'eclipse'
}

version = mod_version
group = mod_group_id

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Create, Ponder, Flywheel — official maven
    maven { url = "https://maven.createmod.net" }
    // Registrate
    maven {
        url = "https://maven.ithundxr.dev/snapshots"
        content { includeGroup "com.tterrag.registrate" }
    }
    // CurseMaven — for soft deps in dev env
    maven {
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    // Modrinth Maven — for RVN/Areas/Collective runtime testing
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    // ── Hard: Create 6.x ─────────────────────────────────────────
    // Slim jar excludes Create's own dependencies from transitive resolution
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    // Ponder — required for in-game tutorial scenes
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    // Flywheel — Create's rendering engine; api for compile, full for runtime
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    // Registrate — Create's block/item registration library
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // ── Soft: Farmers Delight 1.21.1 NeoForge ────────────────────
    // FarmersDelight-1.21.1-1.2.11 (latest as of May 2026)
    compileOnly("curse.maven:farmers-delight-${farmers_delight_curse_id}:${farmers_delight_file_id}")
    // Also available at runtime via Modrinth Maven for testing
    runtimeOnly("maven.modrinth:farmers-delight:${farmers_delight_modrinth_version}")

    // ── Soft: Basic Weapons 1.21.1 NeoForge ─────────────────────
    // basicweapons-neoforge-2.1.4+1.21.1 — vanilla+ weaponry (daggers, clubs, etc.)
    runtimeOnly("maven.modrinth:basicweapons:${basic_weapons_modrinth_version}")

    // ── Soft: Steam 'n' Rails NeoForge 1.21.1 (unofficial port) ──
    // Port by PoppyBlossom — 0.2.0-beta.2 — CurseForge project 1414670
    // File 7919366 is latest stable beta as of writing
    compileOnly("curse.maven:steam-n-rails-neoforge-1414670:7919366")

    // ── Dev runtime helpers (commented out until needed) ─────────
    // localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // ── Runtime: Random Village Names integration testing ────────
    // These mods are loaded at runtime to test the RVN/Areas sign
    // integration in VillageNameProvider. All three are required
    // because RVN depends on Areas, and Areas depends on Collective.
    runtimeOnly("maven.modrinth:random-village-names:${rvn_modrinth_version}")
    runtimeOnly("maven.modrinth:areas:${areas_modrinth_version}")
    runtimeOnly("maven.modrinth:collective:${collective_modrinth_version}")

    // ── Runtime: Create Numismatics — coin currency system ────────
    // Loaded at runtime so our CoinConverter can resolve coin items by ID.
    // Create Numismatics depends on Create (already a hard dep above).
    runtimeOnly("maven.modrinth:numismatics:${numismatics_modrinth_version}")
}